<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بررسی موقعیت</title>
<style>
  body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#f5f7fb;color:#0f172a;padding:18px;line-height:1.8}
  h1{font-size:20px;margin:6px 0 10px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}
  button{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:17px;width:100%;font-family:inherit}
  pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;font-size:13px;margin:0}
  .ok{color:#16a34a;font-weight:bold}
  .bad{color:#dc2626;font-weight:bold}
  small{color:#64748b}
</style>
</head>
<body>
<h1>📍 بررسی دسترسی به موقعیت</h1>
<div class="card">
  <small>این صفحه فقط برای پیدا کردن علت مشکل موقعیت است. هیچ اطلاعاتی را ذخیره یا ارسال نمی‌کند.</small>
</div>
<div class="card">
  <button id="go">بررسی موقعیت الان</button>
</div>
<div class="card">
  <div id="verdict">هنوز بررسی نشده است.</div>
</div>
<div class="card">
  <pre id="log">آماده.</pre>
</div>
<script>
(function(){
  var log = document.getElementById('log');
  var verdict = document.getElementById('verdict');
  var lines = [];
  function add(s){ lines.push(s); log.textContent = lines.join('\n'); }
  function say(html, cls){ verdict.innerHTML = '<span class="' + (cls||'') + '">' + html + '</span>'; }

  var messages = {
    1: 'دسترسی رد شد (PERMISSION_DENIED). مرورگر اجازه نمی‌دهد این صفحه موقعیت را بخواند.',
    2: 'موقعیت در دسترس نیست (POSITION_UNAVAILABLE). GPS روشن نیست یا سیگنال ندارد.',
    3: 'مهلت تمام شد (TIMEOUT). GPS دیر جواب داد.'
  };

  add('شرایط صفحه:');
  add('  آدرس: ' + location.protocol + '//' + location.host);
  add('  امن (HTTPS): ' + (window.isSecureContext ? 'بله' : 'خیر'));
  add('  پشتیبانی geolocation: ' + ('geolocation' in navigator ? 'بله' : 'خیر'));
  add('  داخل قاب (iframe): ' + (window.top !== window.self ? 'بله' : 'خیر'));

  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then(function(p){
      add('  وضعیت اجازه مرورگر: ' + p.state + ' (granted=اجازه داده، prompt=بپرسد، denied=رد شده)');
    }).catch(function(e){ add('  وضعیت اجازه: خواندن نشد (' + e.message + ')'); });
  } else {
    add('  وضعیت اجازه: این مرورگر اجازه را نمی‌خواند');
  }

  document.getElementById('go').addEventListener('click', function(){
    verdict.textContent = 'در حال بررسی…';
    add('');
    add('درخواست موقعیت (' + new Date().toLocaleTimeString('fa-IR') + ')');
    if (!navigator.geolocation){ say('این مرورگر موقعیت را پشتیبانی نمی‌کند.', 'bad'); add('  خطا: geolocation وجود ندارد'); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var c = pos.coords;
      add('  موفق: lat=' + c.latitude.toFixed(5) + ' lon=' + c.longitude.toFixed(5) + ' دقت=' + Math.round(c.accuracy) + 'm');
      say('موقعیت گرفته شد. مشکل از این صفحه نیست.', 'ok');
    }, function(err){
      add('  خطا: code=' + err.code + ' message=' + err.message);
      say(messages[err.code] || ('خطای ناشناخته ' + err.code), 'bad');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
})();
</script>
</body>
</html>
