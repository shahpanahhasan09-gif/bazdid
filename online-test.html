<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><title>بازدید آنلاین</title><style>
*{box-sizing:border-box}:root{--p:#1d4ed8;--bg:#f5f7fb;--line:#e2e8f0;--muted:#64748b;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}body{margin:0;background:var(--bg);font-family:Tahoma,system-ui;color:#0f172a;padding-bottom:30px}.app{max-width:720px;margin:auto;padding:0 12px}.head{margin:0 -12px 14px;padding:18px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:0 0 24px 24px;display:flex;justify-content:space-between;align-items:center}.head h1{font-size:19px;margin:0}.head small{opacity:.85}.card{background:#fff;border:1px solid #e7ebf2;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 10px 28px -22px #0f172a}.field{display:block;margin:10px 0}.field span{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff;font:inherit}.btn{border:0;border-radius:12px;padding:12px 14px;font:700 14px inherit;background:#e2e8f0}.btn.block{width:100%;margin-top:8px}.btn.primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff}.btn.ok{background:#16a34a;color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f8fafc;border-radius:13px;padding:10px 3px}.stat b{display:block;font-size:22px;color:var(--p)}.stat span{font-size:11px;color:var(--muted)}.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.tasktop{display:flex;justify-content:space-between;gap:8px}.code{direction:ltr;color:var(--p);font-weight:800}.badge{font-size:10px;padding:3px 8px;border-radius:16px;background:#fef3c7;color:#92400e}.photos{display:flex;gap:7px;overflow:auto}.photos img{width:82px;height:82px;border-radius:10px;object-fit:cover}.row{display:flex;gap:8px}.row>*{flex:1}.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:25px;display:none;z-index:30}.msg.show{display:block}.login{max-width:430px;margin:12vh auto}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .btn{flex:1}
</style></head><body><div class="app"><section id="login" class="login"><div class="card"><h2>ورود به سامانه بازدید</h2><p class="muted">نسخه آنلاین آزمایشی ۱.۰</p><label class="field"><span>نام کاربری یا ایمیل</span><input id="email" type="text" dir="ltr" autocomplete="username" placeholder="مثلاً test"></label><label class="field"><span>رمز عبور</span><input id="password" type="password" dir="ltr"></label><button class="btn primary block" id="loginBtn">ورود</button><p class="muted">حساب‌ها توسط مدیر سامانه ساخته می‌شوند.</p></div></section><section id="main" class="hidden"><header class="head"><div><h1>📍 بازدید آنلاین <small>آزمایشی ۱.۰</small></h1><small id="who"></small></div><button class="btn" id="logout">خروج</button></header><div class="card stats"><div class="stat"><b id="nAll">۰</b><span>کل</span></div><div class="stat"><b id="nOpen">۰</b><span>باز</span></div><div class="stat"><b id="nDone">۰</b><span>تکمیل</span></div></div><div id="adminTools" class="hidden"><button class="btn primary block" id="newTask">➕ مأموریت جدید</button></div><div id="list"></div></section><section id="editor" class="hidden"><header class="head"><h1 id="editorTitle">مأموریت</h1><button class="btn" id="back">بازگشت</button></header><div id="editorBody"></div></section></div><div class="msg" id="msg"></div><script>
const URL='https://pqebteassyocmzoobntj.supabase.co',KEY='sb_publishable_REffQMswFWw2RFnn6XdSZg_UY3AnDmt';let token='',user=null,profile=null,tasks=[],people=[];const $=s=>document.querySelector(s),fa=n=>Number(n||0).toLocaleString('fa-IR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let e=$('#msg');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
async function api(path,opt={}){const h={apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(URL+path,{...opt,headers:h});if(!r.ok)throw new Error((await r.text())||r.status);const text=await r.text();return text?JSON.parse(text):null}
async function login(){try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:($('#email').value.trim().includes('@')?$('#email').value.trim():$('#email').value.trim()+'@bazdid.local'),password:$('#password').value})});if(!r.ok)throw new Error('نام کاربری یا رمز صحیح نیست');const d=await r.json();token=d.access_token;user=d.user;localStorage.setItem('bazdid_session',JSON.stringify({token,user}));await boot()}catch(e){toast(e.message)}}
async function boot(){try{profile=(await api('/rest/v1/profiles?id=eq.'+user.id+'&select=*'))[0];if(!profile)throw new Error('پروفایل کاربر تعریف نشده');$('#login').classList.add('hidden');$('#main').classList.remove('hidden');$('#who').textContent=profile.full_name+' — '+(profile.role==='responsible'?'مسئول':'مدیر');$('#adminTools').classList.toggle('hidden',profile.role==='responsible');await load()}catch(e){toast(e.message)}}
async function load(){const staff=profile.role!=='responsible';tasks=await api('/rest/v1/tasks?select=*,assigned:profiles!tasks_assigned_to_fkey(full_name,username)&order=created_at.desc');if(staff)people=await api('/rest/v1/profiles?role=eq.responsible&active=eq.true&select=id,full_name,username');render()}
function render(){const open=tasks.filter(x=>!['approved','archived'].includes(x.status)).length,done=tasks.filter(x=>x.status==='approved').length;$('#nAll').textContent=fa(tasks.length);$('#nOpen').textContent=fa(open);$('#nDone').textContent=fa(done);$('#list').innerHTML=tasks.length?tasks.map(t=>`<div class="task"><div class="tasktop"><span class="code">${esc(t.tracking_code)}</span><span class="badge">${label(t.status)}</span></div><b>📍 ${esc([t.region,t.street,t.parking,t.alley].filter(Boolean).join(' - '))}</b><div>${esc(t.problem)}</div><div class="muted">👤 ${esc(t.assigned?.full_name||'تعیین نشده')}</div><button class="btn block" data-open="${t.id}">مشاهده</button></div>`).join(''):'<div class="card muted">مأموریتی وجود ندارد</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTask(b.dataset.open))}
function label(s){return({new:'جدید',seen:'دیده‌شده',in_progress:'در حال انجام',reported:'گزارش رسیده',revision:'اصلاح',approved:'تأیید شده',archived:'بایگانی'})[s]||s}
function jalali(){return new Intl.DateTimeFormat('fa-IR-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('/','-')}
function showEditor(title,html){$('#main').classList.add('hidden');$('#editor').classList.remove('hidden');$('#editorTitle').textContent=title;$('#editorBody').innerHTML=html;scrollTo(0,0)}
$('#back').onclick=()=>{$('#editor').classList.add('hidden');$('#main').classList.remove('hidden')};
$('#newTask').onclick=()=>{const opts=people.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('');showEditor('مأموریت جدید',`<div class="card"><label class="field"><span>کد پیگیری</span><input id="fCode" value="${jalali()}-1" dir="ltr"></label><label class="field"><span>منطقه *</span><input id="fRegion"></label><label class="field"><span>خیابان</span><input id="fStreet"></label><label class="field"><span>شرح مشکل *</span><textarea id="fProblem"></textarea></label><label class="field"><span>مسئول *</span><select id="fPerson"><option value="">انتخاب کنید</option>${opts}</select></label><label class="field"><span>مهلت</span><input id="fDue" type="date"></label><label class="field"><span>عکس قبل</span><input id="fPhoto" type="file" accept="image/*"></label><button class="btn primary block" id="saveTask">ثبت و ارجاع</button></div>`);$('#saveTask').onclick=createTask}
async function upload(file,path){const r=await fetch(URL+'/storage/v1/object/bazdid-private/'+path,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':file.type||'image/jpeg','x-upsert':'true'},body:file});if(!r.ok)throw new Error(await r.text());return path}
async function createTask(){try{const region=$('#fRegion').value.trim(),problem=$('#fProblem').value.trim(),assigned=$('#fPerson').value;if(!region||!problem||!assigned)throw new Error('فیلدهای ستاره‌دار را کامل کنید');let photo=null,file=$('#fPhoto').files[0];if(file)photo=await upload(file,`${user.id}/before/${crypto.randomUUID()}.jpg`);const body={tracking_code:$('#fCode').value.trim(),created_by:user.id,assigned_to:assigned,region,street:$('#fStreet').value.trim(),problem,due_at:$('#fDue').value?new Date($('#fDue').value).toISOString():null,before_photo_path:photo};await api('/rest/v1/tasks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});toast('مأموریت ثبت شد');$('#editor').classList.add('hidden');$('#main').classList.remove('hidden');await load()}catch(e){toast(e.message)}}
async function openTask(id){const t=tasks.find(x=>x.id===id),resp=await api('/rest/v1/task_reports?task_id=eq.'+id+'&select=*&order=created_at.desc');let html=`<div class="card"><div class="code">${esc(t.tracking_code)}</div><h3>📍 ${esc([t.region,t.street].filter(Boolean).join(' - '))}</h3><p>${esc(t.problem)}</p><p class="muted">وضعیت: ${label(t.status)}</p></div>`;if(profile.role==='responsible'){html+=`<div class="card"><button class="btn primary block" id="start">شروع کار</button><label class="field"><span>نتیجه</span><select id="rResult"><option value="complete">انجام کامل</option><option value="partial">ناقص</option><option value="needs_review">نیازمند بررسی</option><option value="impossible">غیرممکن</option></select></label><label class="field"><span>توضیحات</span><textarea id="rNote"></textarea></label><label class="field"><span>عکس‌ها (حداکثر ۳)</span><input id="rPhotos" type="file" accept="image/*" multiple></label><button class="btn ok block" id="submitReport">ارسال گزارش</button></div>`}else if(resp.length){html+=resp.map(r=>`<div class="card"><b>گزارش مسئول</b><p>${esc(r.note)}</p><p class="muted">نتیجه: ${esc(r.result)} — وضعیت: ${esc(r.status)}</p>${r.status==='pending'?`<div class="actions"><button class="btn ok" data-review="${r.id}" data-d="approved">تأیید</button><button class="btn danger" data-review="${r.id}" data-d="revision">برگشت</button></div>`:''}</div>`).join('')}showEditor('جزئیات مأموریت',html);if(profile.role==='responsible'){ $('#start').onclick=async()=>{await api('/rest/v1/rpc/start_task',{method:'POST',body:JSON.stringify({p_task_id:id})});toast('کار شروع شد')};$('#submitReport').onclick=()=>submitReport(id)}else document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.d))}
async function submitReport(id){try{let files=[...$('#rPhotos').files].slice(0,3),note=$('#rNote').value.trim();if(!note||!files.length)throw new Error('توضیح و حداقل یک عکس لازم است');let rid=await api('/rest/v1/rpc/submit_task_report',{method:'POST',body:JSON.stringify({p_task_id:id,p_result:$('#rResult').value,p_done_on:new Date().toISOString().slice(0,10),p_note:note})});for(const f of files){let path=await upload(f,`${user.id}/reports/${rid}/${crypto.randomUUID()}.jpg`);await api('/rest/v1/report_photos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({report_id:rid,storage_path:path})})}toast('گزارش ارسال شد');$('#editor').classList.add('hidden');$('#main').classList.remove('hidden');await load()}catch(e){toast(e.message)}}
async function review(id,d){try{await api('/rest/v1/rpc/review_task_report',{method:'POST',body:JSON.stringify({p_report_id:id,p_decision:d,p_note:null})});toast(d==='approved'?'تأیید شد':'برای اصلاح برگشت');$('#editor').classList.add('hidden');$('#main').classList.remove('hidden');await load()}catch(e){toast(e.message)}}
$('#loginBtn').onclick=login;$('#logout').onclick=()=>{localStorage.removeItem('bazdid_session');location.reload()};(()=>{try{let s=JSON.parse(localStorage.getItem('bazdid_session'));if(s){token=s.token;user=s.user;boot()}}catch(e){}})();
