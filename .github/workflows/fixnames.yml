name: fix-names
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name cleanup-bot
          git config user.email cleanup-bot@users.noreply.github.com
          git ls-files | grep -E ' \([0-9]+\)\.[A-Za-z0-9]+$' | sort -V | while IFS= read -r f; do
            t=$(printf '%s' "$f" | sed -E 's/ \([0-9]+\)(\.[A-Za-z0-9]+)$/\1/')
            echo "rename: $f  ->  $t"
            git rm -q --ignore-unmatch -- "$t"
            git mv -- "$f" "$t"
          done
          git rm -q --ignore-unmatch -- ".github/workflows/fixnames.yml"
          git commit -m "chore: normalize duplicate file names" || echo "nothing to commit"
          git push || true
          echo "----- FINAL FILES -----"
          git ls-files
