name: cleanup-duplicates
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f "stage-02-core (26).html"
          test -f "demo-stage-01 (2).html"
          test -f index.html
          git config user.name cleanup-bot
          git config user.email cleanup-bot@users.noreply.github.com
          for i in $(seq 1 25); do git rm -q --ignore-unmatch -- "stage-02-core ($i).html"; done
          git rm -q --ignore-unmatch -- "stage-02-core.html" "demo-stage-01.html" "demo-stage-01 (1).html" "docx.umd (1).js" "online-candidate.html" "online-test.html" "online-test-v5 (1).html" "online-test-v*.html" ".github/workflows/cleanup.yml"
          git mv -- "stage-02-core (26).html" "stage-02-core.html"
          git mv -- "demo-stage-01 (2).html" "demo-stage-01.html"
          git commit -m "cleanup: keep v2.11.1-WORD-FONT build, remove duplicate experiments"
          git push
