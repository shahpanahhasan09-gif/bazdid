name: cleanup-stage03
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f "stage-03-ops (4).html"
          grep -q "v3.1.3-OPS-CALENDAR" "stage-03-ops (4).html"
          test -f index.html
          git config user.name cleanup-bot
          git config user.email cleanup-bot@users.noreply.github.com
          git rm -q --ignore-unmatch -- "stage-03-ops.html" "stage-03-ops (1).html" "stage-03-ops (2).html" "stage-03-ops (3).html" ".github/workflows/cleanup3.yml"
          git mv -- "stage-03-ops (4).html" "stage-03-ops.html"
          git commit -m "cleanup: keep v3.1.3-OPS-CALENDAR as stage-03-ops.html"
          git push
          echo "----- FINAL FILES -----"
          git ls-files
