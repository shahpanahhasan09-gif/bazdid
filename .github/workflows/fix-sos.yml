name: fix-sos
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clean and rename sos
        run: |
          python3 - <<'PYEOF'
          import re, subprocess, sys
          src = open('sos (1).html', encoding='utf-8').read()
          clean = re.sub(r'<script>\(function\(\)\{function c\(\)\{var b=a\.contentDocument.*?</script>', '', src, flags=re.S)
          open('sos.html', 'w', encoding='utf-8').write(clean)
          h = subprocess.check_output(['git', 'hash-object', 'sos.html']).decode().strip()
          print(h)
          if not h.startswith('4e56cfab'):
              sys.exit('hash mismatch')
          PYEOF
      - name: commit
        run: |
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git rm -q -- 'sos (1).html'
          git add sos.html
          git commit -m "memory: sos card v2.0 (clean copy)"
          git push
