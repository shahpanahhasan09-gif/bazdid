name: fix-names-v372
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kontrol
        run: |
          test -f "stage-03-ops (24).html"
          grep -q "v3.7.2-MENU" "stage-03-ops (24).html"
          test -f index.html
      - name: jaygozin
        run: |
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git rm -q --ignore-unmatch -- "stage-03-ops.html"
          git mv -- "stage-03-ops (24).html" "stage-03-ops.html"
          git rm -q --ignore-unmatch -- .github/workflows/fix-names-v372.yml
          git commit -m "stage 3.7.2: replace stage-03-ops with v3.7.2"
          git push
