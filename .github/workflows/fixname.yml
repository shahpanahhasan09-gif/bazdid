name: fix-docs-names
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name cleanup-bot
          git config user.email cleanup-bot@users.noreply.github.com
          for base in BAZDID-PROJECT-STATUS BAZDID-HANDOVER BAZDID-ARCHIVE; do
            src=$(find . -maxdepth 1 -name "$base (*).md" | sort | tail -1 | sed 's|^\./||')
            if [ -n "$src" ]; then
              git rm -q --ignore-unmatch -- "$base.md"
              git mv -- "$src" "$base.md"
            fi
            find . -maxdepth 1 -name "$base (*).md" -exec git rm -q -f -- {} \;
          done
          git rm -q --ignore-unmatch -- ".github/workflows/fixname.yml"
          git commit -m "docs: normalize handover file names" || echo "nothing to commit"
          git push || true
          echo "----- FINAL FILES -----"
          git ls-files
