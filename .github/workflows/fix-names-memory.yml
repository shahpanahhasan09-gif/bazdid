name: fix-names-memory
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kontrol
        run: |
          test "$(git hash-object -- 'BAZDID-HANDOVER (2).md')" = "01243b9b1b3cba9badc45c125acb40a8531e4f12"
          test "$(git hash-object -- 'BAZDID-PROJECT-STATUS (1).md')" = "bd313aedfa2849de0c4a0c4ea8a990a6a9790d97"
          test "$(git hash-object -- '01-TOR-NAJAT-03 (1).md')" = "028456af7ba7cf90befc934b1a150f67d210d5a9"
          test -f BAZDID-ARCHIVE.md
          test -f index.html
      - name: jaygozin
        run: |
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git rm -q -- 'BAZDID-HANDOVER (1).md' 'BAZDID-HANDOVER.md'
          git mv -- 'BAZDID-HANDOVER (2).md' 'BAZDID-HANDOVER.md'
          git rm -q -- 'BAZDID-PROJECT-STATUS.md'
          git mv -- 'BAZDID-PROJECT-STATUS (1).md' 'BAZDID-PROJECT-STATUS.md'
          git mv -- '01-TOR-NAJAT-03 (1).md' '01-TOR-NAJAT-03.md'
          git rm -q --ignore-unmatch -- .github/workflows/fix-names-memory.yml
          git commit -m "memory: sync handover, status and rescue card"
          git push
