<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8">
<title>کارتابل مسئول پیگیری</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--p:#1d4ed8;--pl:#3b82f6;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}body{margin:0;background:var(--bg);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--text);line-height:1.8;padding-bottom:35px}.app{max-width:680px;margin:auto;padding:0 12px}.head{margin:0 -12px 14px;padding:22px 18px 18px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:20;box-shadow:0 12px 30px -18px #1d4ed8}.head h1{font-size:19px;margin:0}.head p{font-size:12px;margin:1px 0 0;opacity:.82}.card{background:#fff;border:1px solid #e7ebf2;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 10px 28px -20px #0f172a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f8fafc;border-radius:13px;padding:10px 4px}.stat b{display:block;font-size:22px;color:var(--p)}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:20px;white-space:nowrap}.tab.active{background:var(--p);color:#fff}.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.task-top{display:flex;justify-content:space-between;gap:8px}.code{font-weight:800;color:var(--p);direction:ltr}.badge{font-size:11px;border-radius:18px;padding:2px 9px;background:#fef3c7;color:#92400e}.badge.sent{background:#dcfce7;color:#166534}.loc{font-size:13px;color:#475569}.prob{margin:5px 0}.btn{width:100%;border:0;border-radius:12px;padding:12px 15px;font:700 14px inherit;margin-top:8px;background:#e2e8f0}.btn.primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff}.btn.ok{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff}.btn.ghost{background:#f8fafc;border:1px solid var(--line)}.field{display:block;margin:10px 0}.field span{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fbfdff;font:inherit}.photos{display:flex;gap:7px;overflow:auto}.photos img{width:84px;height:84px;object-fit:cover;border-radius:11px}.info{display:flex;border-bottom:1px dashed var(--line);padding:7px 0;gap:8px}.info b{color:var(--muted);font-size:12px;width:85px}.info span{flex:1}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}.notice{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:13px;padding:10px;font-size:12px;margin-bottom:12px}
</style></head><body><div class="app">
<header class="head"><h1>📋 کارتابل مسئول پیگیری</h1><p>دستورها روی همین گوشی نگهداری می‌شوند</p></header>
<section id="home"><div class="card stats"><div class="stat"><b id="sAll">۰</b><span>کل</span></div><div class="stat"><b id="sPending">۰</b><span>در انتظار</span></div><div class="stat"><b id="sSent">۰</b><span>گزارش‌شده</span></div></div><div class="tabs"><button class="tab active" data-f="all">همه</button><button class="tab" data-f="pending">در انتظار</button><button class="tab" data-f="sent">گزارش‌شده</button></div><div id="tasks"></div></section>
<section id="detail" class="hidden"><button class="btn ghost" id="back">↩ بازگشت به کارتابل</button><div class="card"><h2 style="font-size:17px;margin:0 0 8px">دستور کار</h2><div id="taskInfo"></div><a class="btn primary" id="mapLink" target="_blank" style="display:block;text-align:center;text-decoration:none">📍 بازکردن مسیر روی نقشه</a></div><div class="card"><h2 style="font-size:17px;margin:0">ثبت گزارش انجام کار</h2><label class="field"><span>نام گزارش‌دهنده</span><input id="sender"></label><label class="field"><span>نتیجه کار</span><select id="result"><option>انجام کامل</option><option>انجام ناقص</option><option>نیازمند بررسی</option><option>امکان انجام وجود نداشت</option></select></label><label class="field"><span>تاریخ شمسی انجام</span><input id="doneDate" inputmode="numeric" placeholder="مثلاً ۱۴۰۵/۰۷/۱۲"></label><label class="field"><span>شرح کار انجام‌شده</span><textarea id="note" rows="3"></textarea></label><label class="btn ghost" for="photosInput" style="display:block;text-align:center">📷 افزودن حداکثر ۳ عکس</label><input id="photosInput" type="file" accept="image/*" multiple hidden><div class="photos" id="previews"></div><button class="btn ok" id="send">📤 ارسال گزارش به بازرس</button><div class="notice" style="margin-top:10px">بعد از زدن ارسال، پیام‌رسان و سپس بازرس را انتخاب کنید. گزارش روی سرور ذخیره نمی‌شود.</div></div></section>
</div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='bazdid_responsible_tasks_v1';let tasks=[],current=null,photos=[],filter='all';
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const latin=n=>String(n||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const p=new Intl.DateTimeFormat('fa-IR-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),g=t=>(p.find(x=>x.type===t)||{}).value;return fa(`${g('year')}/${g('month')}/${g('day')}`)}
function load(){try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function incoming(){const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return null;return{code,location:q.get('location')||'',problem:q.get('problem')||'',assignee:q.get('assignee')||'',due:q.get('due')||'',map:q.get('map')||'',receivedAt:new Date().toISOString(),status:'pending'}}
function addIncoming(){const t=incoming();if(!t)return;const i=tasks.findIndex(x=>x.code===t.code);if(i<0)tasks.unshift(t);else tasks[i]={...tasks[i],...t,status:tasks[i].status};save();openTask(t.code);history.replaceState({},'',location.pathname)}
function render(){const a=tasks.length,p=tasks.filter(x=>x.status!=='sent').length,s=tasks.filter(x=>x.status==='sent').length;$('#sAll').textContent=fa(a);$('#sPending').textContent=fa(p);$('#sSent').textContent=fa(s);let list=tasks;if(filter==='pending')list=list.filter(x=>x.status!=='sent');if(filter==='sent')list=list.filter(x=>x.status==='sent');$('#tasks').innerHTML=list.length?list.map(t=>`<div class="task"><div class="task-top"><span class="code">${esc(t.code)}</span><span class="badge ${t.status==='sent'?'sent':''}">${t.status==='sent'?'گزارش ارسال شد':'در انتظار'}</span></div><div class="loc">📍 ${esc(t.location||'محل ثبت نشده')}</div><div class="prob">${esc(t.problem)}</div>${t.due?`<div class="loc">⏰ مهلت: ${esc(t.due)}</div>`:''}<button class="btn primary" data-open="${esc(t.code)}">${t.status==='sent'?'مشاهده / ارسال دوباره':'ثبت گزارش'}</button></div>`).join(''):'<div class="empty">دستوری در این بخش وجود ندارد</div>';$$('[data-open]').forEach(b=>b.onclick=()=>openTask(b.dataset.open))}
function openTask(code){current=tasks.find(x=>x.code===code);if(!current)return;$('#home').classList.add('hidden');$('#detail').classList.remove('hidden');$('#taskInfo').innerHTML=`<div class="info"><b>کد</b><span class="code">${esc(current.code)}</span></div><div class="info"><b>محل</b><span>${esc(current.location)}</span></div><div class="info"><b>شرح</b><span>${esc(current.problem)}</span></div>${current.due?`<div class="info"><b>مهلت</b><span>${esc(current.due)}</span></div>`:''}`;$('#mapLink').style.display=current.map?'block':'none';$('#mapLink').href=current.map||'#';$('#sender').value=current.assignee||'';$('#doneDate').value=today();photos=[];$('#previews').innerHTML='';scrollTo(0,0)}
$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#home').classList.remove('hidden');render()};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
async function compress(f){const u=await new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)}),im=await new Promise((r,j)=>{const x=new Image;x.onload=()=>r(x);x.onerror=j;x.src=u});let w=im.width,h=im.height,k=Math.min(1,1280/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',.7)}
function blob(d){const [h,b]=d.split(','),a=new Uint8Array(atob(b).split('').map(x=>x.charCodeAt(0)));return new Blob([a],{type:'image/jpeg'})}
$('#photosInput').onchange=async e=>{photos=[];for(const f of [...e.target.files].slice(0,3))try{photos.push(await compress(f))}catch(_){}$('#previews').innerHTML=photos.map(x=>`<img src="${x}">`).join('')};
$('#send').onclick=async()=>{if(!current)return;if(!photos.length)return alert('حداقل یک عکس اضافه کنید');const date=$('#doneDate').value.trim(),note=$('#note').value.trim(),result=$('#result').value,sender=$('#sender').value.trim();if(!date||!note)return alert('تاریخ و شرح کار را وارد کنید');const back=`${location.origin}${location.pathname.replace(/report\.html$/,'')}?case=${encodeURIComponent(current.code)}`;const text=`✅ گزارش انجام کار\n🔖 کد پیگیری: ${current.code}\n👤 مسئول: ${sender||'-'}\n🗓 تاریخ انجام: ${date}\n📌 نتیجه: ${result}\n📝 توضیحات: ${note}\n🔗 بازکردن پرونده: ${back}`;const fs=photos.map((x,i)=>new File([blob(x)],`report-${i+1}.jpg`,{type:'image/jpeg'}));try{if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,text,title:'گزارش انجام کار'});current.status='sent';current.sentAt=new Date().toISOString();save();render();return}if(navigator.share){await navigator.share({text,title:'گزارش انجام کار'});current.status='sent';save();return}}catch(e){if(e.name==='AbortError')return}await navigator.clipboard.writeText(text);alert('متن گزارش کپی شد. تصاویر را همراه آن ارسال کنید.')};
load();render();addIncoming();
</script></body></html>
